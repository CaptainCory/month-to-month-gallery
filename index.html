<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Month to Month</title>
<link rel="icon" href="logo.svg">
<style>
  :root { --ink:#1b1410; --paper:#f6efe4; --red:#9c3b22; --muted:#6d5f52; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: Georgia, serif; color:var(--ink); background:var(--paper); }
  header { padding:64px 24px 40px; text-align:center; background:var(--ink); color:var(--paper); }
  header h1 { margin:0; font-size:clamp(2rem,6vw,3.5rem); letter-spacing:.02em; }
  header p { margin:12px auto 0; max-width:36rem; opacity:.85; }
  nav { display:flex; flex-wrap:wrap; justify-content:center; gap:16px; padding:14px; background:var(--red); }
  nav a { color:var(--paper); text-decoration:none; font-family:system-ui, sans-serif; font-size:.9rem; }
  section { max-width:960px; margin:0 auto; padding:48px 24px; border-bottom:1px solid #0001; }
  h2 { color:var(--red); font-size:1.6rem; margin-top:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; }
  .card { background:#fff; border:1px solid #0002; padding:16px; }
  .art { aspect-ratio:4/5; background:#e8dccb; display:flex; align-items:center; justify-content:center; color:var(--muted); margin-bottom:10px; }
  .art img { width:100%; height:100%; object-fit:cover; }
  .muted { color:var(--muted); }
  table { border-collapse:collapse; width:100%; }
  td { padding:8px 0; border-bottom:1px solid #0001; }
  .plan { display:grid; grid-template-columns:1fr 2fr 1fr; grid-template-rows:auto 160px; gap:6px; }
  .plan div { background:#fff; border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; text-align:center; padding:8px; font-family:system-ui, sans-serif; font-size:.85rem; }
  .plan .entrance { grid-column:1 / 4; background:var(--red); color:var(--paper); }
  iframe { width:100%; height:320px; border:0; margin-top:16px; }
  footer { text-align:center; padding:32px; font-family:system-ui, sans-serif; font-size:.8rem; color:var(--muted); }
</style>
</head>
<body>
<header><img src="logo.svg" alt="Month to Month" style="width:160px;height:160px;display:block;margin:0 auto 12px"><h1 id="name"></h1><p id="tagline"></p></header>
<nav>
  <a href="#events">Events</a><a href="#paintings">Paintings</a><a href="#visit">Visit</a>
  <a href="#map">Map</a><a href="#about">About</a><a href="#contact">Contact</a>
</nav>

<section id="events"><h2>Calendar</h2><table id="events-list"></table></section>
<section id="paintings"><h2>Paintings for sale</h2><div class="grid" id="paintings-grid"></div></section>
<section id="visit"><h2>Hours</h2><table id="hours"></table><p class="muted" id="address"></p></section>
<section id="map">
  <h2>Map of the shop</h2>
  <div class="plan">
    <div class="entrance">Entrance · Boardwalk</div>
    <div>Artist wall</div><div>Collaborative center</div><div>Artist wall</div>
  </div>
  <p class="muted">Adjacent: studio room.</p>
  <iframe id="gmap" loading="lazy" title="Location map"></iframe>
</section>
<section id="about"><h2>About</h2><div class="grid" id="founders"></div></section>

<section id="contact"><h2>Contact</h2><p id="contact-info"></p></section>
<footer id="footer"></footer>

<script type="module">
  import { site } from "./data.js";

  // Pure renderers: data in, HTML string out.
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const fmtDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
  const fmtPrice = (n) => "$" + n.toLocaleString("en-US");

  const eventRow = (e) => `<tr><td><strong>${esc(fmtDate(e.date))}</strong></td><td>${esc(e.title)}<br><span class="muted">${esc(e.note)}</span></td></tr>`;
  const paintingCard = (p) => `<div class="card"><div class="art">${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.title)}">` : "Image coming"}</div><strong>${esc(p.title)}</strong><br><span class="muted">${esc(p.artist)} · ${esc(p.size || "")} · ${esc(fmtPrice(p.price))} · ${esc(p.status)}</span></div>`;
  const hoursRow = (h) => `<tr><td>${esc(h.days)}</td><td>${esc(h.time)}</td></tr>`;
  const founderCard = (f) => `<div class="card"><strong>${esc(f.name)}</strong><p>${esc(f.bio)}</p></div>`;
  const visitorsText = (v) => v.length ? v.map(esc).join(" · ") : "Our guestbook opens with the first visitors.";
  const contactText = (c) => [c.email && `Email: ${esc(c.email)}`, c.instagram && `Instagram: <a href="https://instagram.com/${esc(c.instagram)}">@${esc(c.instagram)}</a>`, c.phone && `Phone: ${esc(c.phone)}`].filter(Boolean).join("<br>");

  // Adapter: the only DOM mutation.
  const set = (id, html) => { document.getElementById(id).innerHTML = html; };
  const upcoming = [...site.events].sort((a, b) => a.date.localeCompare(b.date));

  document.title = site.name;
  set("name", esc(site.name));
  set("tagline", esc(site.tagline));
  set("events-list", upcoming.length ? upcoming.map(eventRow).join("") : `<tr><td class="muted">New nights announced soon on Instagram.</td></tr>`);
  set("paintings-grid", site.paintings.length ? site.paintings.map(paintingCard).join("") : `<p class="muted">Collection coming online soon. Book a visit to see the work in person.</p>`);
  set("hours", site.hours.map(hoursRow).join(""));
  set("address", esc(site.address));
  set("founders", site.founders.map(founderCard).join(""));
  set("contact-info", contactText(site.contact) || "Message us on Instagram to book a visit.");
  set("footer", `${esc(site.name)} · ${esc(site.address)}`);
  document.getElementById("gmap").src = "https://maps.google.com/maps?output=embed&q=" + encodeURIComponent(site.mapQuery);
</script>
</body>
</html>
